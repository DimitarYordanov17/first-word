[project]
name = "first-word"
version = "0.1.0"
description = "A latency study of a LiveKit voice agent"
readme = "README.md"
authors = [
    { name = "DimitarYordanov17", email = "ivoj_louie@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.2",
    "livekit-plugins-deepgram~=1.8",
    "livekit-plugins-openai~=1.8",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.4",
]


[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
